name: AI Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ezpr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      # EzPR reviews its own PRs with the action built from the PR's own code.
      - uses: actions/checkout@v4
      - uses: ./
        env:
          GEMINI_API_KEY: invalid-key-for-fallback-test
          OPENROUTER_API_KEY: invalid-key-for-fallback-test
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
