name: EzPR
description: Free, open-source AI pull request reviewer with repo context.
author: oBecks
branding:
  icon: eye
  color: blue
inputs:
  github-token:
    description: Token used to read the PR and post comments.
    default: ${{ github.token }}
  ignore:
    description: Newline-separated path globs that are never sent to a model.
    default: ''
  strictness:
    description: How picky the review is - chill, balanced or strict. Overrides .ezpr.yml.
    default: ''
  brains:
    description: Comma- or newline-separated provider ids to use, in order. Overrides .ezpr.yml.
    default: ''
runs:
  using: node24
  main: dist/index.cjs
