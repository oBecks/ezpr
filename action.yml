name: EzPR
description: Free, open-source AI pull request reviewer with repo context.
author: oBecks
branding:
  icon: eye
  color: blue
inputs:
  github-token:
    description: Token used to read the PR and post comments.
    default: ${{ github.token }}
  ignore:
    description: Newline-separated path globs that are never sent to a model.
    default: ''
runs:
  using: node24
  main: dist/index.cjs
